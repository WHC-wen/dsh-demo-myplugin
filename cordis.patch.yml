# Mount the prompt-opt demo plugin when this package is registered as a
# DeepSeek Harness profile bundle. The row is a bare plugin by package name:
# the node half (exports ".") runs in the host process (webServer route that
# optimizes prompts), and the `dsh.client` declaration in package.json makes
# the browser half (exports "./client") load in the web GUI.
- insert:
    - id: prompt-opt
      name: "dsh-demo-myplugin"
